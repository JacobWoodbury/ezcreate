[package]
name = "ezcreate"
version = "0.1.0"
edition = "2024"
description = "Townscaper-style modular building sandbox (Bevy port of ezcreate)"

[dependencies]
avian3d = "0.6.1"
bevy = "0.18.1"
bevy_egui = "0.39.1"
dirs = "6.0.0"
log = { version = "*", features = ["max_level_debug", "release_max_level_warn"] }
serde = "1.0.228"
serde_json = "1.0.150"

# Faster dev runs: optimize dependencies, keep your code quick to compile
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
